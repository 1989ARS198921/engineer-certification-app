<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container" style="max-width:1200px;margin:0 auto;padding:20px;">
        <!-- Логин -->
        <div id="login-box" style="max-width:400px;margin:100px auto;background:var(--bg-primary);border-radius:20px;padding:40px;box-shadow:var(--shadow);">
            <h2 style="text-align:center;font-size:28px;">🔐 Админ-панель</h2>
            <p style="text-align:center;color:#666;margin-bottom:16px;">Введите пароль для доступа</p>
            <input type="password" id="admin-password" placeholder="Введите пароль" style="width:100%;padding:12px;border:2px solid var(--border-color);border-radius:8px;font-size:16px;margin-bottom:12px;background:var(--bg-primary);color:var(--text-primary);">
            <button class="btn btn-primary" style="width:100%;padding:12px;background:#2196F3;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;" onclick="adminLogin()">Войти</button>
            <div id="admin-error" style="color:#f44336;margin-top:8px;display:none;text-align:center;">Неверный пароль</div>
            <div style="margin-top:16px;text-align:center;">
                <a href="/" style="color:#2196F3;">← На главную</a>
            </div>
        </div>

        <!-- Панель -->
        <div id="admin-panel" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
                <h1 style="font-size:28px;">📝 Админ-панель</h1>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-add" style="background:#4CAF50;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="openAddQuestion()">➕ Добавить вопрос</button>
                    <button class="btn btn-edit" style="background:#FF9800;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="openTheoryEditor()">📖 Теория</button>
                    <button class="btn btn-cancel" style="background:#9e9e9e;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="adminLogout()">🚪 Выйти</button>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;">
                <div style="background:var(--bg-card);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--border-color);">
                    <div style="font-size:28px;font-weight:700;color:#2196F3;" id="stat-total">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);">Всего вопросов</div>
                </div>
                <div style="background:var(--bg-card);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--border-color);">
                    <div style="font-size:28px;font-weight:700;color:#2196F3;" id="stat-sections">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);">Разделов</div>
                </div>
                <div style="background:var(--bg-card);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--border-color);">
                    <div style="font-size:28px;font-weight:700;color:#2196F3;" id="stat-multiple">0</div>
                    <div style="font-size:13px;color:var(--text-secondary);">С множественным выбором</div>
                </div>
            </div>

            <div id="sections-admin"></div>
        </div>
    </div>

    <!-- Модальное окно вопроса -->
    <div id="question-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;padding:20px;">
        <div style="background:var(--bg-primary);border-radius:16px;padding:30px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;">
            <h2 id="modal-title">Добавить вопрос</h2>
            <input type="hidden" id="edit-id">
            <label style="display:block;margin:12px 0 4px;font-weight:600;font-size:14px;">Раздел</label>
            <select id="edit-section" style="width:100%;padding:10px;border:2px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-primary);color:var(--text-primary);"></select>
            <label style="display:block;margin:12px 0 4px;font-weight:600;font-size:14px;">Тип</label>
            <select id="edit-type" style="width:100%;padding:10px;border:2px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-primary);color:var(--text-primary);">
                <option value="0">Одиночный выбор</option>
                <option value="1">Множественный выбор</option>
            </select>
            <label style="display:block;margin:12px 0 4px;font-weight:600;font-size:14px;">Вопрос</label>
            <textarea id="edit-text" rows="3" style="width:100%;padding:10px;border:2px solid var(--border-color);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg-primary);color:var(--text-primary);"></textarea>
            <label style="display:block;margin:12px 0 4px;font-weight:600;font-size:14px;">Ответы</label>
            <div id="edit-answers" style="margin:12px 0;"></div>
            <button style="background:#4CAF50;color:white;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;" onclick="addAnswerField()">➕ Добавить ответ</button>
            <label style="display:block;margin:12px 0 4px;font-weight:600;font-size:14px;">Объяснение</label>
            <textarea id="edit-explanation" rows="2" style="width:100%;padding:10px;border:2px solid var(--border-color);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg-primary);color:var(--text-primary);"></textarea>
            <label style="display:block;margin:12px 0 4px;font-weight:600;font-size:14px;">Сложность (1-3)</label>
            <input type="number" id="edit-difficulty" min="1" max="3" value="2" style="width:100%;padding:10px;border:2px solid var(--border-color);border-radius:8px;font-size:14px;background:var(--bg-primary);color:var(--text-primary);">
            <div style="display:flex;gap:12px;margin-top:16px;justify-content:flex-end;">
                <button style="background:#9e9e9e;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="closeModal('question-modal')">Отмена</button>
                <button style="background:#2196F3;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="saveQuestion()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно теории -->
    <div id="theory-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;padding:20px;">
        <div style="background:var(--bg-primary);border-radius:16px;padding:30px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;">
            <h2>📖 Редактировать теорию</h2>
            <p style="color:#666;font-size:14px;margin-bottom:12px;">Используйте Markdown для форматирования</p>
            <div id="theory-editor"></div>
            <div style="display:flex;gap:12px;margin-top:16px;justify-content:flex-end;">
                <button style="background:#9e9e9e;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="closeModal('theory-modal')">Отмена</button>
                <button style="background:#2196F3;color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;" onclick="saveTheory()">Сохранить теорию</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // АДМИН-ПАНЕЛЬ
        // ============================================================

        let currentData = [];
        let currentTheory = {};
        const ADMIN_PASSWORD = 'admin123';

        function adminLogin() {
            const password = document.getElementById('admin-password').value;
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('adminToken', password);
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('admin-error').style.display = 'block';
            }
        }

        function adminLogout() {
            localStorage.removeItem('adminToken');
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('admin-password').value = '';
            document.getElementById('admin-error').style.display = 'none';
        }

        document.getElementById('admin-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') adminLogin();
        });

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ
        // ============================================================

        async function loadAdminData() {
            try {
                const token = localStorage.getItem('adminToken');
                const res = await fetch('/api/admin/questions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) {
                    showToast('Сессия истекла', 'error');
                    adminLogout();
                    return;
                }
                currentData = await res.json();
                renderAdminSections();
                updateAdminStats();
            } catch (e) {
                showToast('Ошибка загрузки данных', 'error');
            }
        }

        function updateAdminStats() {
            const allQuestions = currentData.flatMap(s => s.questions || []);
            document.getElementById('stat-total').textContent = allQuestions.length;
            document.getElementById('stat-sections').textContent = currentData.length;
            document.getElementById('stat-multiple').textContent = allQuestions.filter(q => q.type === 1).length;
        }

        function renderAdminSections() {
            const container = document.getElementById('sections-admin');
            if (!currentData || currentData.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;padding:40px;">Нет данных. Добавьте вопросы!</p>';
                return;
            }
            container.innerHTML = currentData.map(section => `
                <div style="background:var(--bg-card);border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid var(--border-color);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <h2 style="font-size:18px;">${section.section}</h2>
                        <span style="background:#e3f2fd;color:#2196F3;padding:4px 12px;border-radius:20px;font-size:13px;">${(section.questions || []).length} вопросов</span>
                    </div>
                    ${(section.questions || []).map(q => `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border-color);gap:10px;">
                            <span style="flex:1;font-size:14px;">${q.id}. ${q.text.substring(0, 80)}${q.text.length > 80 ? '...' : ''}</span>
                            <span style="font-size:12px;color:#999;margin-right:8px;">${q.type === 1 ? '🔄' : '○'}</span>
                            <div style="display:flex;gap:6px;">
                                <button style="background:#FF9800;color:white;padding:4px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;" onclick="openEditQuestion(${q.id})">✏️</button>
                                <button style="background:#f44336;color:white;padding:4px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;" onclick="deleteQuestion(${q.id})">🗑️</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        // ============================================================
        // РАБОТА С ВОПРОСАМИ
        // ============================================================

        function openAddQuestion() {
            document.getElementById('modal-title').textContent = '➕ Добавить вопрос';
            document.getElementById('edit-id').value = '';
            document.getElementById('edit-text').value = '';
            document.getElementById('edit-explanation').value = '';
            document.getElementById('edit-difficulty').value = 2;
            document.getElementById('edit-type').value = 0;
            populateSections();
            renderAnswers([]);
            document.getElementById('question-modal').style.display = 'flex';
        }

        async function openEditQuestion(id) {
            try {
                const token = localStorage.getItem('adminToken');
                const res = await fetch(`/api/admin/question/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                document.getElementById('modal-title').textContent = '✏️ Редактировать вопрос';
                document.getElementById('edit-id').value = id;
                document.getElementById('edit-text').value = data.question.text;
                document.getElementById('edit-explanation').value = data.question.explanation || '';
                document.getElementById('edit-difficulty').value = data.question.difficulty || 2;
                document.getElementById('edit-type').value = data.question.type || 0;
                populateSections(data.section);
                renderAnswers(data.question.answers);
                document.getElementById('question-modal').style.display = 'flex';
            } catch (e) {
                showToast('Ошибка загрузки вопроса', 'error');
            }
        }

        function populateSections(selected) {
            const select = document.getElementById('edit-section');
            select.innerHTML = currentData.map(s => 
                `<option value="${s.section}" ${s.section === selected ? 'selected' : ''}>${s.section}</option>`
            ).join('');
            if (currentData.length === 0) {
                select.innerHTML = '<option value="Новый раздел">Новый раздел</option>';
            }
        }

        function renderAnswers(answers) {
            const container = document.getElementById('edit-answers');
            if (!answers || answers.length === 0) {
                answers = [{ text: '', isCorrect: false }];
            }
            container.innerHTML = answers.map((a, i) => `
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                    <input type="text" placeholder="Вариант ответа ${i+1}" value="${a.text || ''}" data-index="${i}" style="flex:1;padding:8px;border:2px solid var(--border-color);border-radius:6px;background:var(--bg-primary);color:var(--text-primary);">
                    <label style="font-weight:400;font-size:13px;white-space:nowrap;">
                        <input type="checkbox" ${a.isCorrect ? 'checked' : ''} data-index="${i}"> Правильный
                    </label>
                    <button style="background:#f44336;color:white;padding:4px 8px;border:none;border-radius:4px;cursor:pointer;font-size:12px;" onclick="removeAnswer(${i})">✕</button>
                </div>
            `).join('');
            updateAnswerIndices();
        }

        function addAnswerField() {
            const container = document.getElementById('edit-answers');
            const count = container.children.length;
            const div = document.createElement('div');
            div.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px;';
            div.innerHTML = `
                <input type="text" placeholder="Вариант ответа ${count+1}" data-index="${count}" style="flex:1;padding:8px;border:2px solid var(--border-color);border-radius:6px;background:var(--bg-primary);color:var(--text-primary);">
                <label style="font-weight:400;font-size:13px;white-space:nowrap;">
                    <input type="checkbox" data-index="${count}"> Правильный
                </label>
                <button style="background:#f44336;color:white;padding:4px 8px;border:none;border-radius:4px;cursor:pointer;font-size:12px;" onclick="removeAnswer(${count})">✕</button>
            `;
            container.appendChild(div);
            updateAnswerIndices();
        }

        function removeAnswer(index) {
            const container = document.getElementById('edit-answers');
            const rows = container.querySelectorAll('div');
            if (rows.length <= 1) {
                showToast('Должен быть хотя бы один ответ', 'error');
                return;
            }
            rows[index].remove();
            updateAnswerIndices();
        }

        function updateAnswerIndices() {
            const container = document.getElementById('edit-answers');
            const rows = container.querySelectorAll('div');
            rows.forEach((row, i) => {
                const inputs = row.querySelectorAll('input');
                inputs.forEach(inp => inp.dataset.index = i);
                const placeholder = row.querySelector('input[type="text"]');
                if (placeholder) placeholder.placeholder = `Вариант ответа ${i+1}`;
            });
        }

        function getAnswersFromUI() {
            const container = document.getElementById('edit-answers');
            const rows = container.querySelectorAll('div');
            return Array.from(rows).map(row => {
                const text = row.querySelector('input[type="text"]').value;
                const isCorrect = row.querySelector('input[type="checkbox"]').checked;
                return { text, isCorrect };
            });
        }

        async function saveQuestion() {
            const id = document.getElementById('edit-id').value;
            const section = document.getElementById('edit-section').value;
            const text = document.getElementById('edit-text').value;
            const explanation = document.getElementById('edit-explanation').value;
            const difficulty = parseInt(document.getElementById('edit-difficulty').value) || 2;
            const type = parseInt(document.getElementById('edit-type').value);
            const answers = getAnswersFromUI();

            if (!text.trim()) { showToast('Введите текст вопроса', 'error'); return; }
            if (answers.some(a => !a.text.trim())) { showToast('Заполните все варианты ответов', 'error'); return; }
            if (!answers.some(a => a.isCorrect)) { showToast('Выберите правильный ответ', 'error'); return; }

            const question = { text, answers, explanation, difficulty, type };
            const token = localStorage.getItem('adminToken');

            try {
                let res;
                if (id) {
                    res = await fetch(`/api/admin/question/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ section, question })
                    });
                } else {
                    res = await fetch('/api/admin/question', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ section, question })
                    });
                }
                const data = await res.json();
                if (data.success) {
                    showToast(id ? '✅ Вопрос обновлён' : '✅ Вопрос добавлен', 'success');
                    closeModal('question-modal');
                    loadAdminData();
                } else {
                    showToast('Ошибка сохранения', 'error');
                }
            } catch (e) {
                showToast('Ошибка сохранения', 'error');
            }
        }

        async function deleteQuestion(id) {
            if (!confirm('Удалить вопрос?')) return;
            const token = localStorage.getItem('adminToken');
            try {
                const res = await fetch(`/api/admin/question/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Вопрос удалён', 'success');
                    loadAdminData();
                }
            } catch (e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        // ============================================================
        // РЕДАКТИРОВАНИЕ ТЕОРИИ
        // ============================================================

        async function openTheoryEditor() {
            try {
                const token = localStorage.getItem('adminToken');
                const res = await fetch('/api/admin/theory', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                currentTheory = await res.json();
                const container = document.getElementById('theory-editor');
                const sections = Object.keys(currentTheory);
                if (sections.length === 0) {
                    container.innerHTML = '<p style="color:#999;">Нет разделов с теорией.</p>';
                    document.getElementById('theory-modal').style.display = 'flex';
                    return;
                }
                container.innerHTML = sections.map(section => `
                    <div style="margin-bottom:16px;padding:12px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border-color);">
                        <label style="font-weight:600;display:block;margin-bottom:4px;">${section}</label>
                        <input type="text" class="theory-title" data-section="${section}" value="${currentTheory[section].title || section}" style="width:100%;padding:6px 10px;border:2px solid var(--border-color);border-radius:6px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);">
                        <textarea class="theory-textarea" data-section="${section}" rows="5" style="width:100%;padding:8px;border:2px solid var(--border-color);border-radius:6px;font-family:inherit;background:var(--bg-primary);color:var(--text-primary);">${currentTheory[section].content || ''}</textarea>
                    </div>
                `).join('');
                document.getElementById('theory-modal').style.display = 'flex';
            } catch (e) {
                showToast('Ошибка загрузки теории', 'error');
            }
        }

        async function saveTheory() {
            const textareas = document.querySelectorAll('.theory-textarea');
            const titles = document.querySelectorAll('.theory-title');
            const newTheory = {};
            textareas.forEach(ta => {
                const section = ta.dataset.section;
                const titleInput = document.querySelector(`.theory-title[data-section="${section}"]`);
                newTheory[section] = {
                    title: titleInput ? titleInput.value : section,
                    content: ta.value
                };
            });
            const token = localStorage.getItem('adminToken');
            try {
                const res = await fetch('/api/admin/theory', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(newTheory)
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Теория сохранена', 'success');
                    closeModal('theory-modal');
                }
            } catch (e) {
                showToast('Ошибка сохранения теории', 'error');
            }
        }

        // ============================================================
        // ОБЩИЕ ФУНКЦИИ
        // ============================================================

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function showToast(message, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.style.cssText = `
                position:fixed;bottom:30px;right:30px;padding:14px 24px;border-radius:10px;
                color:white;font-weight:600;z-index:2000;animation:slideUp 0.3s ease;
                background:${type === 'success' ? '#4CAF50' : '#f44336'};
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Закрытие модалки по клику вне
        document.querySelectorAll('#question-modal, #theory-modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });

        // Проверка авторизации при загрузке
        if (localStorage.getItem('adminToken')) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadAdminData();
        }

        console.log('✅ Админ-панель загружена!');
    </script>
</body>
</html>
